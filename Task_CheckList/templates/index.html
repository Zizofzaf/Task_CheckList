<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f9fc">
  <meta name="csrf-token" content="{{ csrf }}">
  <title>My Tasks — Task Checklist</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script defer src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="m15 5 4 4M4 20l4.5-1 10.7-10.7a2.1 2.1 0 0 0-3-3L5.5 16 4 20Z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2ZM19 17v5m-2.5-2.5h5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
  </svg>

  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="My Tasks home">
        <span class="brand-mark"><svg class="icon"><use href="#i-check"></use></svg></span>
        <span>mytasks<span class="brand-dot">.</span></span>
      </a>
      <span class="topbar-right"><span class="status-dot"></span> Personal workspace</span>
    </header>

    <main class="content">
      <div class="intro"><div class="eyebrow"><span class="eyebrow-line"></span> STAY IN YOUR FLOW</div>
        <div class="hero-row">
          <div><h1>One thing <span>at a time.</span></h1><p>Everything you need to get done, all in one calm place.</p></div>
          <button class="primary-button add-desktop" id="open-add" type="button"><svg class="icon"><use href="#i-plus"></use></svg> New task</button>
        </div>
      </div>

      <section class="task-section" aria-labelledby="queue-title">
        <div class="section-header">
          <div class="section-heading"><h2 id="queue-title">Your queue</h2><span id="pending-count" class="count-pill" aria-live="polite">0</span></div>
          <span class="sort-label"><svg class="icon"><use href="#i-calendar"></use></svg> Sorted by deadline</span>
        </div>
        <div id="task-list" class="task-list" aria-live="polite" aria-busy="true">
          <div class="loading-state">Loading your tasks…</div>
        </div>
      </section>

      <footer class="page-footer"><span>Small steps add up.</span><span id="today-label"></span></footer>
    </main>
    <button id="mobile-add" class="mobile-add primary-button" type="button"><svg class="icon"><use href="#i-plus"></use></svg> New task</button>
  </div>

  <dialog id="task-dialog" class="task-dialog" aria-labelledby="dialog-title">
    <form id="task-form" class="dialog-content" autocomplete="off">
      <div class="dialog-header"><div><span class="eyebrow dialog-eyebrow">YOUR NEXT STEP</span><h2 id="dialog-title">Create a task</h2></div><button id="close-dialog" class="icon-button" type="button" aria-label="Close"><svg class="icon"><use href="#i-close"></use></svg></button></div>
      <div class="form-grid">
        <label class="form-field full"><span>Task name <span class="required">*</span></span><input id="task-title" name="title" type="text" maxlength="140" required placeholder="e.g. Assignment 2"></label>
        <label class="form-field full"><span>Subject <span class="required">*</span></span><select id="task-subject" name="subject_code" required><option value="" disabled selected>Choose a subject</option>{% for code, name in subjects.items() %}<option value="{{ code }}">{{ name }} ({{ code }})</option>{% endfor %}</select></label>
        <label class="form-field"><span>Type <span class="required">*</span></span><select id="task-type" name="task_type" required>{% for type in types %}<option value="{{ type }}">{{ type }}</option>{% endfor %}</select></label>
        <label class="form-field"><span>Due date <span class="required">*</span></span><input id="task-date" name="due_date" type="date" required></label>
        <label class="form-field full"><span>Due time <span class="optional">optional, defaults to 11:59 PM</span></span><input id="task-time" name="due_time" type="time"></label>
        <label class="form-field full"><span>Notes <span class="optional">optional</span></span><textarea id="task-notes" name="notes" rows="3" maxlength="1500" placeholder="Anything you'd like to remember…"></textarea></label>
      </div>
      <div id="form-error" class="form-error" role="alert" hidden></div>
      <div class="dialog-actions"><button id="cancel-dialog" class="secondary-button" type="button">Cancel</button><button id="save-task" class="primary-button" type="submit">Save task <svg class="icon"><use href="#i-arrow"></use></svg></button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden><span id="toast-message"></span><button id="toast-undo" type="button" hidden>Undo</button><button id="toast-close" class="toast-close" type="button" aria-label="Dismiss"><svg class="icon"><use href="#i-close"></use></svg></button></div>
</body>
</html>
